<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifra de César</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2575fc;
        }

        .description {
            text-align: center;
            margin-bottom: 25px;
            color: #666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #2575fc;
            outline: none;
        }

        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            min-height: 120px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #2575fc;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 25px;
            display: none;
        }

        .result-container h2 {
            margin-bottom: 10px;
            color: #2575fc;
        }

        .result-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            min-height: 100px;
            word-break: break-word;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cifra de César</h1>
        <p class="description">
            A Cifra de César é uma técnica de criptografia que substitui cada letra do texto
            por outra letra do alfabeto, deslocada por um número fixo de posições (a chave).
        </p>

        <form id="caesarForm">
            <div class="form-group">
                <label>Modo:</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="encrypt" name="mode" value="e" checked>
                        <label for="encrypt">Cifrar</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="decrypt" name="mode" value="d">
                        <label for="decrypt">Decifrar</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="text">Texto:</label>
                <textarea id="text" name="text" placeholder="Digite o texto aqui..." required></textarea>
            </div>

            <div class="form-group">
                <label for="key">Chave k (número inteiro):</label>
                <input type="number" id="key" name="key" value="3" required>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="removeAccents" name="removeAccents">
                    <label for="removeAccents">Remover acentos antes de processar</label>
                </div>
            </div>

            <button type="submit">Processar</button>
        </form>

        <div class="result-container" id="resultContainer">
            <h2>Resultado:</h2>
            <div class="result-box" id="result"></div>
        </div>

        <div class="footer">
            Interface baseada no algoritmo Python de Cifra de César
        </div>
    </div>

    <script>
        document.getElementById('caesarForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Obter valores do formulário
            const modo = document.querySelector('input[name="mode"]:checked').value;
            const texto = document.getElementById('text').value;
            const k = parseInt(document.getElementById('key').value);
            const removerAcentos = document.getElementById('removeAccents').checked;

            // Processar texto
            let textoProcessado = texto;

            if (removerAcentos) {
                textoProcessado = removeAcentos(textoProcessado);
            }

            // Aplicar Cifra de César
            let resultado;
            if (modo === 'd') {
                resultado = caesar(textoProcessado, -k);
            } else {
                resultado = caesar(textoProcessado, k);
            }

            // Exibir resultado
            document.getElementById('result').textContent = resultado;
            document.getElementById('resultContainer').style.display = 'block';
        });

        // Função para remover acentos
        function removeAcentos(s) {
            return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        // Função para aplicar a Cifra de César
        function caesar(text, k) {
            k = k % 26;
            let resultado = '';

            for (let i = 0; i < text.length; i++) {
                resultado += shiftChar(text[i], k);
            }

            return resultado;
        }

        // Função para deslocar um caractere
        function shiftChar(c, k) {
            if (c >= 'A' && c <= 'Z') {
                const base = 'A'.charCodeAt(0);
                return String.fromCharCode((c.charCodeAt(0) - base + k + 26) % 26 + base);
            }

            if (c >= 'a' && c <= 'z') {
                const base = 'a'.charCodeAt(0);
                return String.fromCharCode((c.charCodeAt(0) - base + k + 26) % 26 + base);
            }

            return c;
        }
    </script>
</body>
</html>
